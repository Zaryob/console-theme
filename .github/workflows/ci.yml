# SPDX-License-Identifier: GPL-2.0-or-later
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Vocabulary: duplicate keys and placeholder mismatches.
      - run: python3 scripts/check_i18n.py
      # Sync contract against temporary targets; the sibling repositories are not needed.
      - run: npm test
      # Browser regressions for language, search and highlighting.
      - run: npm run test:console
